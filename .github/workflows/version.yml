name: Version

# Injects the pushed commit's short SHA into the page version indicator
# (<meta name="version"> + footer .version-tag) and commits it back to
# main with [skip ci], so the deployed static site always shows which
# commit it was built from. Commits containing [skip ci] do not
# retrigger this workflow, so there is no loop.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject short SHA into version indicator
        env:
          SHORT_SHA: ${{ github.event.after }}
        run: |
          short="${SHORT_SHA:0:7}"
          sed -i -E 's|(<meta name="version" content=")[^"]*(">)|\1'"$short"'\2|' ptaki-przewodnik/index.html
          sed -i -E 's|(<span class="version-tag">v\. )[^<]*(</span>)|\1'"$short"'\2|' ptaki-przewodnik/index.html

      - name: Commit and push version bump
        env:
          SHORT_SHA: ${{ github.event.after }}
        run: |
          if git diff --exit-code --quiet -- ptaki-przewodnik/index.html; then
            echo "Version indicator already current, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ptaki-przewodnik/index.html
          git commit -m "chore: version indicator -> v.${SHORT_SHA:0:7} [skip ci]"
          git pull --rebase origin main
          git push
